<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Poppins, Segoe UI, Arial, sans-serif">
  <title>Goreto.store × Daraz Express (DEX): integration workflow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F97316"/>
    </marker>
    <style>
      .lane { fill: #FAFAFB; stroke: #E2E8F0; stroke-width: 1.5; }
      .laneTitle { font-size: 18px; font-weight: 700; fill: #0F172A; }
      .laneSub { font-size: 12px; fill: #64748B; }
      .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .boxApi { fill: #FFF2E4; stroke: #FB923C; stroke-width: 1.5; }
      .step { font-size: 13px; font-weight: 600; fill: #0F172A; }
      .detail { font-size: 11px; fill: #334155; }
      .num { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
      .numBg { fill: #F97316; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .api { stroke: #F97316; stroke-width: 1.8; fill: none; marker-end: url(#arrowOrange); }
      .label { font-size: 11px; fill: #C2410C; font-weight: 600; }
      .foot { font-size: 12px; fill: #64748B; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0F172A">Goreto.store × Daraz Express (DEX): integration workflow</text>
  <text x="40" y="68" font-size="13" fill="#64748B">Cash on Delivery only · Daraz Open Platform Logistics API (EPIS), gateway api.daraz.com.np/rest · signed with App Key / App Secret</text>

  <!-- Lanes -->
  <rect class="lane" x="30" y="90" width="360" height="600" rx="16"/>
  <text class="laneTitle" x="50" y="120">Goreto store &amp; customer</text>
  <text class="laneSub" x="50" y="138">Website / WhatsApp orders, admin staff</text>

  <rect class="lane" x="420" y="90" width="360" height="600" rx="16"/>
  <text class="laneTitle" x="440" y="120">Goreto server</text>
  <text class="laneSub" x="440" y="138">Next.js + Supabase (orders, shipments, events)</text>

  <rect class="lane" x="810" y="90" width="360" height="600" rx="16"/>
  <text class="laneTitle" x="830" y="120">Daraz / DEX</text>
  <text class="laneSub" x="830" y="138">EPIS API, DEX hubs and riders, OMS payouts</text>

  <!-- Store lane steps -->
  <rect class="box" x="50" y="160" width="320" height="58" rx="12"/>
  <circle class="numBg" cx="72" cy="182" r="11"/><text class="num" x="68" y="186">1</text>
  <text class="step" x="92" y="186">Customer places a COD order</text>
  <text class="detail" x="92" y="204">Nepal address, phone, delivery service</text>

  <rect class="box" x="50" y="240" width="320" height="58" rx="12"/>
  <circle class="numBg" cx="72" cy="262" r="11"/><text class="num" x="68" y="266">2</text>
  <text class="step" x="92" y="266">Staff accept → courier = DEX</text>
  <text class="detail" x="92" y="284">Then click "Book with Daraz" (box, weight)</text>

  <rect class="box" x="50" y="400" width="320" height="58" rx="12"/>
  <circle class="numBg" cx="72" cy="422" r="11"/><text class="num" x="68" y="426">5</text>
  <text class="step" x="92" y="426">Print AWB label, pack, "Ready to ship"</text>
  <text class="detail" x="92" y="444">Parcel handed to the DEX rider at pickup</text>

  <rect class="box" x="50" y="560" width="320" height="58" rx="12"/>
  <circle class="numBg" cx="72" cy="582" r="11"/><text class="num" x="68" y="586">8</text>
  <text class="step" x="92" y="586">Customer tracks the order</text>
  <text class="detail" x="92" y="604">Goreto tracking page shows DEX status + ETA</text>

  <!-- Server lane steps -->
  <rect class="box" x="440" y="240" width="320" height="76" rx="12"/>
  <circle class="numBg" cx="462" cy="262" r="11"/><text class="num" x="458" y="266">3</text>
  <text class="step" x="482" y="266">Build package from the order snapshot</text>
  <text class="detail" x="482" y="284">items, COD total (NPR), addresses, R-code,</text>
  <text class="detail" x="482" y="300">box L×W×H + weight, reference = order no.</text>

  <rect class="box" x="440" y="330" width="320" height="58" rx="12"/>
  <circle class="numBg" cx="462" cy="352" r="11"/><text class="num" x="458" y="356">4</text>
  <text class="step" x="482" y="356">Save tracking number + event</text>
  <text class="detail" x="482" y="374">Shipment booked; customer sees "Booked"</text>

  <rect class="box" x="440" y="480" width="320" height="76" rx="12"/>
  <circle class="numBg" cx="462" cy="502" r="11"/><text class="num" x="458" y="506">7</text>
  <text class="step" x="482" y="506">Sync tracking (cron / refresh / webhook)</text>
  <text class="detail" x="482" y="524">new events only; picked up → shipped;</text>
  <text class="detail" x="482" y="540">delivered → COD collected; failures → staff</text>

  <rect class="box" x="440" y="580" width="320" height="76" rx="12"/>
  <circle class="numBg" cx="462" cy="602" r="11"/><text class="num" x="458" y="606">9</text>
  <text class="step" x="482" y="606">Reconcile COD settlement</text>
  <text class="detail" x="482" y="624">record payout reference + tracking numbers;</text>
  <text class="detail" x="482" y="640">expected vs paid</text>

  <!-- Daraz lane steps -->
  <rect class="boxApi" x="830" y="160" width="320" height="58" rx="12"/>
  <text class="step" x="850" y="186">One-time setup</text>
  <text class="detail" x="850" y="204">OTP account link · pickup &amp; return warehouses</text>

  <rect class="boxApi" x="830" y="250" width="320" height="58" rx="12"/>
  <text class="step" x="850" y="276">Create package (EPIS)</text>
  <text class="detail" x="850" y="294">returns packageCode + trackingNumber + ETA</text>

  <rect class="boxApi" x="830" y="400" width="320" height="58" rx="12"/>
  <text class="step" x="850" y="426">AWB (pdf/zpl) · Ready to ship</text>
  <text class="detail" x="850" y="444">pickup → hubs → out for delivery</text>

  <rect class="boxApi" x="830" y="480" width="320" height="76" rx="12"/>
  <circle class="numBg" cx="852" cy="502" r="11"/><text class="num" x="848" y="506">6</text>
  <text class="step" x="872" y="506">Package history / push</text>
  <text class="detail" x="872" y="524">status timeline, fee, failed-delivery flag;</text>
  <text class="detail" x="872" y="540">re-attempt / return · cancel · support case</text>

  <rect class="boxApi" x="830" y="580" width="320" height="76" rx="12"/>
  <text class="step" x="850" y="606">DEX collects cash, pays out</text>
  <text class="detail" x="850" y="624">3–5 business days, several payouts a week</text>
  <text class="detail" x="850" y="640">statement in DEX OMS (oms.dex.com.np)</text>

  <!-- Flows -->
  <path class="flow" d="M210,218 L210,240"/>
  <path class="flow" d="M370,270 L440,270"/>
  <path class="api" d="M760,270 L830,276"/>
  <text class="label" x="768" y="262">POST</text>
  <path class="api" d="M830,300 C800,330 790,350 760,358"/>
  <path class="flow" d="M440,370 C400,390 390,410 370,420"/>
  <path class="api" d="M370,432 C600,470 700,440 830,430"/>
  <text class="label" x="560" y="452">AWB · RTS</text>
  <path class="api" d="M830,518 L760,518"/>
  <text class="label" x="770" y="510">GET history</text>
  <path class="flow" d="M440,540 C400,560 390,575 370,585"/>
  <path class="api" d="M830,618 L760,618"/>

  <text class="foot" x="40" y="725">Secrets (App Key/Secret) stay on the server. Webhook: POST /api/courier/webhooks/daraz, HMAC-SHA256(appKey + body, appSecret) verified, 200 within 500 ms.</text>
  <text class="foot" x="40" y="745">No rider location or photos are stored; Goreto keeps status events only. Prices and COD amounts always come from Goreto's database, never the browser.</text>
</svg>
